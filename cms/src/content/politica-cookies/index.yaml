title: "Politica de Cookies"
description: "Politica de cookies a Narro. Află cum folosim cookies pentru o experiență mai bună."
content: |
  # Politica de Cookies

  ## Ce sunt cookies-urile

  Cookies sunt fișiere mici de text care sunt stocate pe dispozitivul dumneavoastră atunci când vizitați un site web. Acestea ajută site-ul să își amintească informații despre navigarea dumneavoastră, preferințele și setările pentru a oferi o experiență mai bună.

  ## Cum utilizăm cookies-urile

  Utilizăm cookies pentru a:

  - Menține sesiunea dumneavoastră activă pe site
  - Recomanda servicii relevante pentru nevoile dumneavoastră
  - Înțelege cum interacționați cu site-ul nostru și îmbunătăți conținutul
  - Memora preferințele de limbă și regiune
  - Măsura eficacitatea campaniilor de marketing

  ## Tipurile de cookies pe care le utilizăm

  ### Cookies esențiale

  Aceste cookies sunt necesare pentru funcționarea de bază a site-ului. Fără ele, anumite funcționalități nu vor funcționa corect.

  ### Cookies de performanță

  Ne ajută să înțelegem cum vizitatorii interacționează cu site-ul, colectând informații anonime despre paginile vizitate și eventualele erori întâlnite.

  ### Cookies de funcționalitate

  Permit site-ului să vă amintească alegerile (cum ar fi numele de utilizator, limba sau regiunea) pentru a oferi o experiență mai personalizată.

  ### Cookies de marketing

  Sunt utilizate pentru a vă trimite Mesaje relevante și campanii de marketing care vă interesează.

  ## Gestionarea cookies-urilor

  Puteți controla și/sau șterge cookies-urile așa cum doriți. Puteți șterge toate cookies-urile deja stocate pe dispozitivul dumneavoastră sau le puteți configura astfel încât browserele să nu le accepte.

  **Notă:** dacă setați browserul să blocheze cookies, unele funcționalități ale site-ului nostru nu vor mai fi disponibile.

  ## Cookies terțe părți

  Site-ul nostru poate folosi cookies de la terțe părți, cum ar fi:

  - **Google Analytics** — pentru analize și statistici de trafic
  - **Google Tag Manager** — pentru gestionarea tag-urilor și scripturilor de trackin

  Toate aceste servicii au propriile politici de confidențialitate și de utilizare a cookies.

  ## Actualizări ale politicii

  Această Politică de Cookies poate fi actualizată periodic. Vă rugăm să revizuiți această pagină ocazional pentru a fi informat cu privire la modul în care utilizăm cookies.

  ## Contact

  Dacă aveți întrebări despre Politica noastră de Cookies, vă rugăm să ne contactați la **[contact@narro.ro](mailto:contact@narro.ro)**.
