title: "Termeni și Condiții"
description: "Termeni și condiții Narro. Citește condițiile de utilizare ale site-ului și serviciilor."
content: |
  # Termeni și Condiții

  **Last updated: ianuarie 2025**

  ## 1. Introducere

  Bine ați venit pe site-ul Narro. Accesul și utilizarea acestui site sunt supuse următorilor termeni și condiții. Vă rugăm să citiți cu atenție acești termeni înainte de a utiliza site-ul nostru.

  Prin accesarea și utilizarea acestui site, acceptați să fiți legat de acești termeni și condiții.

  ## 2. Despre Narro

  Narro este o agenție de branding și comunicare vizuală care oferă servicii de creare a identitatilor de brand, design grafic, producție foto-video, strategie de comunicare și servicii de social media.

  ## 3. Utilizarea site-ului

  Vă permiteți utilizarea acestui site exclusiv pentru scopuri informaționale și personale. Nu puteți modifica, copia, distribui, transforma sau crea lucrări derivate din conținutul site-ului fără consimțământul nostru scris prealabil.

  ### Utilizatori interziși

  Site-ul nu poate fi utilizat de:

  - Persoane care nu au capacitatea juridică de a încheia contracte
  - Persoane care nu pot accepta acești termeni și condiții
  - Utilizatori care nu respectă legislația aplicabilă

  ## 4. Drepturi de proprietate intelectuală

  Toate conținuturile de pe acest site — inclusiv text, imagini, logo-uri, grafice, videoclipuri și design — sunt proprietatea Narro sau a licențiatorilor săi și sunt protejate de legile privind drepturile de autor și proprietatea intelectuală.

  ## 5. Servicii și comenzi

  Când solicitați o ofertă sau comandați servicii de la Narro:

  - Comunicarea dintre părți se face pe email sau telefonic
  - Oferta valabilă este cea emisă în scris de Narro
  - Contractul se consideră încheiat odata cu acceptarea ofertei și plata avansului
  - Prețurile afișate pe site sunt estimate și pot varia în funcție de complexitatea proiectului

  ## 6. Confidențialitate

  Narro se angajează să protejeze confidențialitatea informațiilor personale ale utilizatorilor săi. Prelucrarea datelor cu caracter personal se face în conformitate cu Regulamentul General privind Protecția Datelor (GDPR).

  Pentru mai multe detalii, consultați [Politica noastră de Cookies](/politica-cookies).

  ## 7. Limitarea răspunderii

  Narro nu va fi responsabilă pentru:

  - Daune directe, indirecte, accidentale sau conexe rezultate din utilizarea site-ului
  - Modificările aduse site-ului în orice moment, fără preaviz
  - Accesul neautorizat la datele dumneavoastră în afara controlului nostru rezonabil
  - Integritatea și confidențialitatea tranzacțiilor electronice

  ## 8. Link-uri către site-uri terțe

  Site-ul nostru poate conține link-uri către site-uri terțe. Aceste link-uri sunt furnizate doar pentru comoditatea dumneavoastră. Narro nu are niciun control asupra conținutului acestor site-uri și nu este responsabil pentru practicile lor de confidențialitate.

  ## 9. Modificări ale termenilor

  Narro își rezervă dreptul de a modifica acești termeni și condiții oricând. Modificările intră în vigoare de la data publicării pe site. Vă rugăm să verificați periodic acești termeni pentru eventuale modificări.

  ## 10. Legea aplicabilă

  Acești termeni și condiții sunt guvernați de legislația din România. Orice litigiu rezultat din interpretarea sau executarea acestui contract va fi soluționat pe cale amiabilă. În caz contrar, litigiile vor fi rezolate de instanțele competente de la sediul Narro.

  ## 11. Contact

  Pentru întrebări privind acești termeni și condiții, ne puteți contacta:

  - **Email:** [contact@narro.ro](mailto:contact@narro.ro)
  - **Telefon:** sunați-ne direct prin formularul de contact
  - **Adresă:** vizitați-ne în studio

  ---

  *Vă mulțumim că ați ales Narro pentru proiectul dumneavoastră de branding!*
