title: Story Time — Narro
description: Povestea din spatele Narro. De la founding story la proiecte și evenimente.
stories:
  - title: Cum am început
    paragraphs:
      - >-
        Bianca le-a avut dintotdeauna cu latina. Așa că, după lupte seculare
        care au durat două zile, a ieșit „narro" — care, obviously, vine din
        latină și înseamnă „a nara, a povesti".
      - >-
        Dar n-a fost de ajuns, așa că a dat-o filozofic, inspirată de o expresie
        cunoscută (tot latină): _Cogito, ergo sum_. Sooooo — **"Narro, ergo sum"
        înseamnă "povestesc, deci exist"**.
      - >-
        De aici s-a făcut echipă cu Geo, care are talent la povești, la vorbe de
        duh și la chestii legate de artă, muzică și limbi străine (nu prea e
        modestă).
      - >-
        Ideea e că ne pricepem să vă povestim brandul. Suntem mai mult decât o
        agen... whatever the hell that means. Nu băgăm GPT nici în povești, nici
        în design.
      - Pupi!
  - title: Bine, bine, dar ce faceți voi aici?
    paragraphs:
      - >-
        Ne-am ocupat cu verbe, cu nume, cu firme pictate cu mâna și cu ce nu ne
        place la feedback. Foarte frumos. Dar dacă cineva ne-ar opri pe stradă
        și ne-ar întreba, ce zicem?
      - >-
        Zicem „branding și social media" și omul dă din cap, și amândoi ne
        prefacem că s-a înțeles ceva.
      - >-
        Hai altfel. Concret, astea sunt lucrurile care ne trec prin mână: găsim
        nume. Alegem culori și fonturi, și pe urmă le apărăm de toată lumea,
        inclusiv de noi. Scriem texte care sună a om. Fotografiem. Punem ordine
        într-un cont de Instagram care arată ca un sertar. Facem meniuri,
        etichete, semne, tot ce ajunge să fie văzut.
      - Dar dacă ne întrebi ce facem _de fapt_, e un singur lucru.
      - >-
        Luăm ceva ce știi despre tine, dar nu poți explica, și îl facem
        explicabil. Aia e toată treaba. Ai un local, un atelier, un cabinet, și
        știi perfect de ce e altfel decât celelalte. Simți asta în fiecare zi.
        Doar că, atunci când trebuie s-o spui în trei secunde, pe un ecran de
        telefon, unui om care nu te cunoaște, se transformă în „calitate și
        profesionalism".
      - Noi stăm între ce știi tu și ce înțelege el.
      - >-
        Uneori asta iese ca un logo. Alteori ca o propoziție de opt cuvinte pe
        care o pui în bio și gata. Depinde. Dar niciodată nu începe cu desenul.
      - Over and out.
