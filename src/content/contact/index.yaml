title: Contact — Narro
description: >-
  Contactează-ne pentru proiecte de branding, design și comunicare vizuală.
  Da-ne un beep!
heading: DA-NE UN BEEP
intro: >-
  Scrie-ne ce faci și ce te doare. Răspundem în două zile lucrătoare, cu un om,
  nu cu un formular automat.
form:
  submitLabel: Trimite
  fields:
    - id: nume
      label: Nume*
      type: input
      inputType: text
      required: true
      options: []
    - id: email
      label: E-mail*
      type: input
      inputType: email
      required: true
      options: []
    - id: business
      label: Business*
      type: input
      inputType: text
      required: true
      options: []
    - id: serviciu
      label: Serviciu
      type: select
      inputType: text
      required: false
      options:
        - label: Proiectul de Brand
          value: Proiectul de Brand
        - label: Program Social
          value: Program Social
        - label: Radiografia
          value: Radiografia
        - label: Identitate Vizuală
          value: Identitate Vizuală
        - label: Kit de Pornire
          value: Kit de Pornire
        - label: Design Grafic
          value: Design Grafic
        - label: Ton of Voice
          value: Ton of Voice
        - label: Content Production
          value: Content Production
        - label: Social Media
          value: Social Media
    - id: budget
      label: Buget
      type: select
      inputType: text
      required: false
      options:
        - label: Sub 5.000 EUR
          value: <5000
        - label: 5.000 - 10.000 EUR
          value: 5000-10000
        - label: 10.000 - 20.000 EUR
          value: 10000-20000
        - label: Peste 20.000 EUR
          value: '>20000'
    - id: mesaj
      label: Care-i treaba?
      type: textarea
      inputType: text
      required: false
      options: []
imageAlt: Contact — Da-ne un beep
