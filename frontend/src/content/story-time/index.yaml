title: Story Time — Narro
description: Povestea din spatele Narro. De la founding story la proiecte și evenimente.
stories:
  - title: Cum a început Narro
    image: /images/story-time/stories/0/image.png
    imageAlt: Cum a început Narro
    paragraphs:
      - >-
        Povestea noastră a început cu o pasiune pentru design și o credință că
        fiecare brand are o poveste de spus. Am creat Narro pentru a transforma
        ideile în identități vizuale memorabile.
      - >-
        De la prima întâlnire cu primii clienți până la echipa pe care o formăm
        astăzi, fiecare pas a fost o lecție și o oportunitate de a crea ceva
        special.
  - title: Programul Social Narro
    image: /images/story-time/stories/1/image.png
    imageAlt: Programul Social Narro
    paragraphs:
      - >-
        Am lansat Programul Social pentru a susține organizațiile nonprofit cu
        branding de calitate la preț accesibil. Credem că fiecare organizație
        socială merită să fie vizibilă.
      - >-
        Prin acest program, colaborăm cu ONG-uri și asociații care fac diferența
        în comunitățile lor, oferindu-le instrumentele de comunicare de care au
        nevoie.
  - title: 50 de proiecte completate
    image: /images/story-time/stories/2/image.png
    imageAlt: 50 de proiecte completate
    paragraphs:
      - >-
        Am atins un milestone important — 50 de proiecte de branding și design
        livrate pentru clienți din diverse industrii. De la startup-uri la
        organizații mari.
      - >-
        Fiecare proiect ne-a învățat ceva nou și ne-a făcut mai buni în ceea ce
        facem. Suntem mândri de ceea ce am creat împreună cu clienții noștri.
