title: "Politica de Cookies — Narro"
description: "Ce cookie-uri folosim pe narro.co.com și cum îți poți schimba alegerea."
content: |
  # Politica de cookies

  **Ultima actualizare: 6 noiembrie 2026**

  ## Ce sunt cookie-urile

  Sunt fișiere mici de text pe care site-ul le salvează în browserul tău ca să funcționeze sau ca să înțelegem cum e folosit.

  ## Ce folosim

  | Cookie | Furnizor | Tip | La ce folosește | Durată |
  | --- | --- | --- | --- | --- |
  | cookie-ul de consimțământ | narro.co.com | necesar | ține minte ce ai ales în banner | 6 luni |
  | `_ga` | Google Analytics | analiză | deosebește vizitatorii între ei | 2 ani |
  | `_ga_<ID>` | Google Analytics | analiză | păstrează starea sesiunii | 2 ani |

  Nu folosim cookie-uri de publicitate sau remarketing. Pe Instagram ajungi doar printr-un link simplu, fără pluginuri încorporate.

  ## Consimțământ

  Cookie-urile necesare funcționează fără acord. Cele de analiză pornesc doar după ce apeși „Accept”. Dacă apeși „Refuz” sau închizi bannerul, nu se încarcă.

  ## Cum îți schimbi alegerea

  Din linkul „Setări cookies” din footer, din setările browserului (Chrome, Firefox, Safari, Edge) sau cu add-on-ul oficial Google Analytics Opt-out.

  Detalii despre ce se întâmplă cu datele găsești în [Politica de confidențialitate](/politica-de-confidentialitate).
