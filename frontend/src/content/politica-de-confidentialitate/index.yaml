title: "Politica de confidențialitate — Narro"
description: "Cum colectăm, folosim și păstrăm datele tale pe narro.co.com, în conformitate cu GDPR."
content: |
  # Politica de confidențialitate

  **Ultima actualizare: 6 noiembrie 2026**

  ## 1. Cine suntem

  Operatorul datelor tale este NARRO BRANDING SRL, CUI 52551185, nr. de ordine în registrul comerțului J2025071996005, cu sediul în Sat Florești, com. Florești, Str. Ioachim Olteanu nr. 27A, jud. Cluj. Ne poți scrie la [narro.branding@gmail.com](mailto:narro.branding@gmail.com).

  ## 2. Ce date colectăm

  - Din formularul de contact: nume, e-mail, numele business-ului, serviciul care te interesează, bugetul estimat și ce ne scrii în mesaj.
  - Când lucrăm împreună: datele persoanei de contact (nume, e-mail, telefon, funcție) și datele de facturare.
  - Automat, când navighezi: date tehnice (adresă IP, browser, pagini vizitate). Datele de analiză le colectăm doar dacă accepți cookie-urile de analiză.
  - Fotografii și video: dacă apari în materialele produse pentru un client, prelucrarea se face pe baza acordului dat clientului sau nouă, după caz.

  ## 3. De ce le folosim și pe ce temei

  - Să-ți răspundem și să-ți facem o ofertă: demersuri înainte de contract, art. 6(1)(b) GDPR.
  - Să derulăm contractul: executarea contractului, art. 6(1)(b).
  - Facturare și contabilitate: obligație legală, art. 6(1)(c).
  - Raportări către finanțator (proiect SMIS 312538), unde e cazul: obligație legală și contractuală, art. 6(1)(c).
  - Securitatea și funcționarea site-ului: interes legitim, art. 6(1)(f).
  - Statistici de trafic: consimțământ, art. 6(1)(a).

  Nu vindem date și nu facem profilare sau decizii automate.

  ## 4. Cine mai vede datele

  - Furnizori care ne ajută să funcționăm: furnizorul de găzduire a site-ului (Cloudflare), Web3Forms (procesarea formularului) și Google (e-mail; Google Analytics și Google Tag Manager doar cu acordul tău);
  - Contabilul nostru;
  - Autoritățile, la cerere, în limitele legii;
  - Administratorul schemei de ajutor de minimis și autoritățile de management și control ale Programului Incluziune și Demnitate Socială, la verificări, doar pentru documentele proiectului.

  ## 5. Transferuri în afara UE

  Unii furnizori (de exemplu Google) pot prelucra date în SUA. Transferul se face pe baza EU–US Data Privacy Framework sau a clauzelor contractuale standard ale Comisiei Europene.

  ## 6. Cât păstrăm datele

  - Mesajele care nu devin colaborări: 12 luni de la ultimul contact;
  - Datele din contracte și facturi: cât cere legislația fiscal-contabilă și contractul de subvenție;
  - Datele de analiză: maximum 14 luni.

  ## 7. Drepturile tale

  Ai dreptul de acces, de rectificare, de ștergere, de restricționare, de portabilitate și de opoziție, plus dreptul să-ți retragi oricând consimțământul. Ne scrii la [narro.branding@gmail.com](mailto:narro.branding@gmail.com) și îți răspundem în cel mult 30 de zile. Poți depune plângere la ANSPDCP (B-dul G-ral Gheorghe Magheru 28–30, București, [www.dataprotection.ro](https://www.dataprotection.ro)).

  ## 8. Securitate

  Folosim conexiune criptată (HTTPS), acces restricționat la date și parole pe fiecare cont. Nicio metodă nu e perfectă, dar dacă se întâmplă ceva, te anunțăm cum cere legea.

  ## 9. Minori

  Site-ul nu se adresează persoanelor sub 16 ani.

  ## 10. Modificări

  Dacă schimbăm ceva, actualizăm data de sus.
