title: "Termeni și Condiții — Narro"
description: "Termenii și condițiile de utilizare a site-ului narro.co.com și ale colaborării cu NARRO BRANDING SRL."
content: |
  # Termeni și condiții

  **Ultima actualizare: 6 noiembrie 2026**

  ## 1. Cine suntem

  Site-ul [narro.co.com](https://narro.co.com) aparține NARRO BRANDING SRL, CUI 52551185, nr. de ordine în registrul comerțului J2025071996005, EUID ROONRC.J2025071996005, cu sediul în Sat Florești, com. Florești, Str. Ioachim Olteanu nr. 27A, jud. Cluj, [narro.branding@gmail.com](mailto:narro.branding@gmail.com). Suntem întreprindere socială, atestat seria CJ/A nr. 0394 din 13.10.2025.

  ## 2. La ce folosește site-ul

  Site-ul are rol de prezentare: cine suntem, ce servicii oferim, cât costă orientativ și cum ne contactezi. Pe site nu se încheie contracte și nu se fac plăți.

  ## 3. Cum folosești site-ul

  Îl poți citi și distribui linkurile liber. Nu ai voie să încerci să accesezi părți ale lui fără drept, să-l încarci cu trafic automat, să copiezi conținut în masă sau să te dai drept NARRO.

  ## 4. Prețuri

  Prețurile de pe site sunt de pornire, în lei. NARRO BRANDING SRL nu este plătitoare de TVA, așa că prețurile afișate sunt finale. Prețul exact al unui proiect e cel din oferta scrisă pe care ți-o trimitem.

  ## 5. Cum începem o colaborare

  1) Ne scrii, ne vedem sau vorbim la telefon.
  2) Îți trimitem o ofertă scrisă, cu livrabile, termene, număr de runde de revizie și preț. Oferta e valabilă 15 zile.
  3) Semnăm contractul și plătești avansul de 50%.
  4) Pornim. Restul se plătește la predare, dacă în contract nu stabilim altă îșeșalonare.

  Pentru serviciile lunare (Social Media, Content Production), facturarea e lunară, în avans, iar contractul se poate denunța cu un preaviz de 30 de zile.

  Radiografia costă 900 lei, se livrează în 5 zile lucrătoare de la plată și primirea informațiilor de la tine. Suma se scade integral din orice proiect contractat cu noi în cel mult 30 de zile calendaristice de la livrarea Radiografiei.

  ## 6. Anulare

  Dacă renunți după ce am început lucrul, avansul acoperă munca făcută până atunci. Dacă munca depășește valoarea avansului, plătești diferența proporțional, conform contractului. Dacă anulăm noi din motive care ne privesc, îți returnăm integral sumele pentru partea nelivrată.

  Pentru persoane fizice: contractele de servicii încheiate la distanță au un drept de retragere de 14 zile (OUG 34/2014). Dacă ne ceri explicit să începem înainte de expirarea termenului, plătești doar partea deja executată.

  ## 7. Drepturile asupra livrabilelor

  - Până la plata integrală, toate materialele rămân ale noastre.
  - După plata integrală, drepturile patrimoniale de autor asupra livrabilelor finale (logo, identitate, texte, fotografii, video) trec la tine, pentru toate utilizările, pe tot teritoriul și pe toată durata de protecție. Excepțiile se trec în contract.
  - Variantele nealese, schițele și fișierele de lucru rămân ale noastre, dacă nu stabilim altfel.
  - Fonturile, fotografiile de stoc și muzica licențiate de la terți au licența lor proprie. Îți spunem în scris ce trebuie cumpărat pe numele tău.
  - Lucrările le putem arăta în portofoliu doar cu acordul tău sau anonimizat.

  ## 8. Ce ai de făcut tu

  Ne dai la timp informațiile, accesele și feedbackul necesare. Garantezi că materialele pe care ni le trimiți (texte, logo-uri, poze) sunt ale tale sau ai dreptul să le folosești. Întârzierile din partea ta mută termenele noastre cu același număr de zile.

  ## 9. Răspundere

  Răspundem pentru ce livrăm, în limitele contractului. Nu răspundem pentru rezultatele comerciale ale unei campanii (vânzări, urmăritori, reach), pentru deciziile platformelor (Meta, TikTok, Google) sau pentru întreruperi ale site-ului care nu țin de noi. Nimic din acest document nu limitează drepturile pe care le ai prin lege ca persoană fizică.

  ## 10. Forță majoră

  Nicio parte nu răspunde pentru întârzieri cauzate de evenimente pe care nu le putea controla. Partea afectată o anunță pe cealaltă în cel mult 5 zile.

  ## 11. Date personale

  Vezi [Politica de confidențialitate](/politica-de-confidentialitate) și [Politica de cookies](/politica-cookies).

  ## 12. Linkuri externe

  Nu răspundem pentru conținutul site-urilor la care trimitem prin linkuri.

  ## 13. Litigii

  Încercăm întâi să rezolvăm orice problemă direct, la [narro.branding@gmail.com](mailto:narro.branding@gmail.com). Se aplică legea română.

  - Firme: instanțele de la sediul NARRO.
  - Persoane fizice: poți apela la [ANPC](https://anpc.ro) sau la procedura [SAL](https://anpc.ro/ce-este-sal), iar instanța competentă e cea prevăzută de lege, inclusiv cea de la domiciliul tău.

  ## 14. Modificări

  Putem actualiza acești termeni oricând. Pentru proiectele deja contractate rămâne valabilă versiunea din momentul semnării.

  ## 15. Contact

  [narro.branding@gmail.com](mailto:narro.branding@gmail.com). Răspundem în două zile lucrătoare.
