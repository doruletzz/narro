manifesto:
  hidden: false
  label: Bine, bine, dar cu ce mă ajută asta pe mine?
  image: /images/manifesto/manifesto/image.webp
  imageAlt: Echipa Narro
  paragraphs:
    - >-
      Cel mai des, oamenii vin la noi obosiți. De decizii mărunte și muncă. Ce
      pun azi pe Instagram. De ce ultima poză a mers și asta nu. Dacă noul meniu
      ar trebui să arate ca cel vechi sau nu. Fiecare e o nimica toată. Puse cap
      la cap, îți mănâncă săptămâna.
    - >-
      Ce se schimbă e că întrebările astea nu mai ajung la tine. Pentru că,
      odată ce e clar ce ești și cum arăți, majoritatea se răspund singure.
      Culoarea e deja aleasă. Tonul e deja stabilit. Rămâne execuția, care e
      ușoară.
    - >-
      Practic, asta arată așa: cineva se ocupă de identitate - nume, logo,
      culori, reguli. Altcineva se ocupă de ce se vede lunar - postări, texte,
      fotografii. Uneori de amândouă, uneori doar de una. Depinde unde ești.
directia:
  hidden: false
  label: Sunt mai multe treburi. Le luăm pe rând.
  cards:
    - eyebrow: Treaba despre..
      title: Branding
      description: >-
        Aici intră tot ce face ca businessul tău să fie recunoscut înainte să-și
        spună numele. Pornim de la business, de la ce faci, pentru cine, în ce
        categorie joci, ce te diferențiază de ceilalți care fac același lucru pe
        aceeași stradă. De acolo ies poziționarea, mesajele, tonul, și abia la
        final logo-ul, culorile și fonturile.

        Diferența dintre un brand făcut așa și unul făcut invers se vede peste
        doi ani. Unul rezistă și se extinde, celălalt trebuie refăcut de fiecare
        dată când apare un material nou.

        Practic, asta înseamnă că nu mai iei aceleași zece decizii mărunte în
        fiecare marți. Culoarea e deja aleasă. Tonul e deja stabilit. De aici
        totul alunecă mai ușor.
      image: /images/directia/directia/cards/0/image.webp
      imageAlt: Branding - Identitate vizuală
      href: /servicii#branding
    - eyebrow: 'Care-i treaba cu '
      title: Conținut
      description: >-
        Scriem textele, facem vizualurile și venim la tine cu aparatul. Lunar,
        primești materialele gata de publicat și un calendar editorial care
        spune ce urcă și când. Tu îți ții conturile și publici când vrei.

        E varianta pentru cine are deja mâna pe comunicare și îi place așa, dar
        a rămas fără ce să pună. Sau pentru cine a încercat să facă singur și a
        descoperit că trei postări pe săptămână înseamnă, de fapt, o slujbă.

        Textele sună a om. Pozele sunt poze adevărate și nu le mai are nimeni.
      image: /images/directia/directia/cards/1/image.webp
      imageAlt: Conținut - Content creation
      href: /servicii#continut
    - eyebrow: 'Treaba cu '
      title: Social Media
      description: >-
        Preluăm conturile de tot. Planificăm, scriem, publicăm, răspundem la
        mesaje și comentarii, măsurăm ce s-a întâmplat. La sfârșit de lună
        primești un raport pe care chiar îl citește cineva înainte să ți-l
        trimită.

        Vine în trei praguri, în funcție de câte platforme ții și cât de des
        publici.
      image: /images/directia/directia/cards/2/image.webp
      imageAlt: Social Media - Social media management
      href: /servicii#social-media
