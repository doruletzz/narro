manifesto:
  label: MANIFESTO
  image: /images/manifesto/manifesto/image.png
  imageAlt: Echipa Narro — Branding manifest
  paragraphs:
    - >-
      **Branding** wears many faces. We peel them back like bad wallpaper. We
      find the heartbeat and let it set the pace.
    - >-
      **The result:** a logo that bites, a palette that sings, a font that winks
      back. All of them alive. All of them trouble.
    - >-
      **You** will recognize it by its constant motion. It fidgets. It
      interrupts. It leaves the room then comes back with better stories.
