studiiDeCazuri:
  hidden: false
  label: Studii de caz
  description: Ce am mai văzut | Ce am mai gândit | Ce ni s-a părut interesant
  items:
    - title: „The future's bright, the future's Orange."
      description: >-
        nchide ochii și du-te în anii ’90. Un telefon mobil era cât o cărămidă,
        costa cât o vacanță, și suna doar dacă erai în locul potrivit.
        Tehnologia era scumpă, complicată și, sincer, un pic rece. 
      image: /images/studii-de-caz/studiiDeCazuri/items/0/image.png
      imageAlt: „The future's bright, the future's Orange."
      ctaLabel: Află mai multe
      href: /contact
    - title: Firme vechi vs firme noi - design în stradă vs reclame luminoase
      description: >
        Ce s-a câștigat și ce s-a pierdut când firmele au încetat să mai fie
        pictate cu mâna.

        Până prin anii '80, aproape orice firmă de pe stradă era pictată manual.
        Exista chiar o meserie pentru asta, cu nume și cu respect - omul care o
        făcea era un fel de artizan care știa litere, culoare și compoziție.
        Fiecare firmă era făcută o singură dată, pentru un singur perete. 
      image: /images/studii-de-caz/studiiDeCazuri/items/1/image.png
      imageAlt: Firme vechi vs firme noi - design în stradă vs reclame luminoase
      ctaLabel: Află mai multe
      href: /contact
